name: LANCommander.Launcher.Legacy

on:
  push:
    branches: [main, feature/legacy-launcher, refactor/legacy-launcher-rebuild]
    paths:
      - 'LANCommander.Launcher.Legacy/**'
      - 'liblancommander/**'
      - '.gitmodules'
      - '.github/workflows/LANCommander.Launcher.Legacy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LANCommander.Launcher.Legacy/**'
      - 'liblancommander/**'
      - '.gitmodules'
      - '.github/workflows/LANCommander.Launcher.Legacy.yml'
  workflow_dispatch:

jobs:
  # The Win9x job cross-builds and cannot execute what it produces, so the SDK's
  # own tests run natively here. This is also the only compile coverage for
  # picoposh's POSIX backends (pico_os_dir_posix.c, pico_os_http_sock.c).
  test-sdk:
    name: SDK tests (native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch picoposh submodule
        run: |
          git submodule update --init --depth 1 -- liblancommander/vendor/picoposh
          # zlib + libzip back Expand-Archive. Never --recursive: picoposh also
          # pins Watt-32, a large DOS-only TCP/IP stack we never compile.
          git -C liblancommander/vendor/picoposh submodule update --init --depth 1 \
              -- third_party/zlib third_party/libzip

      # No setup-vendor.ps1 here: cJSON is committed, and the SDK does not need
      # miniz or Allegro (both are launcher dependencies).
      - name: Configure
        run: cmake -S liblancommander -B build -DLANCOMMANDER_BUILD_TESTS=ON -DLANCOMMANDER_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  test-launcher:
    name: Launcher tests (headless)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No submodules needed: nothing here reaches outside src/.
      - name: Configure
        run: cmake -S LANCommander.Launcher.Legacy/tests -B build-launcher-tests

      - name: Build
        run: cmake --build build-launcher-tests -j$(nproc)

      - name: Test
        run: ctest --test-dir build-launcher-tests --output-on-failure

  build-win9x:
    name: Build (Win9x / MinGW-w64 i686)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fetch picoposh explicitly rather than via `submodules: true`, which
      # would also pull the two External/GameOverlay.* submodules this job does
      # not need. Never use `submodules: recursive` — picoposh pins Watt-32, a
      # large DOS-only TCP/IP stack we never compile.
      - name: Fetch picoposh submodule
        shell: bash
        run: |
          git submodule update --init --depth 1 -- liblancommander/vendor/picoposh
          # zlib + libzip back Expand-Archive. Never --recursive: picoposh also
          # pins Watt-32, a large DOS-only TCP/IP stack we never compile.
          git -C liblancommander/vendor/picoposh submodule update --init --depth 1 \
              -- third_party/zlib third_party/libzip

      # ---------------------------------------------------------------
      # MSYS2 with MinGW32 (i686) toolchain
      # ---------------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            make

      # ---------------------------------------------------------------
      # Vendor dependencies (cJSON, miniz, Allegro 4 source)
      # ---------------------------------------------------------------
      - name: Download vendor dependencies
        shell: pwsh
        run: ./setup-vendor.ps1

      # ---------------------------------------------------------------
      # Build Allegro 4 from source (static, no addons)
      # ---------------------------------------------------------------
      - name: Build Allegro 4
        run: |
          ALLEGRO_SRC="LANCommander.Launcher.Legacy/vendor/allegro4/allegro5-4.4.3.1"
          ALLEGRO_BUILD="LANCommander.Launcher.Legacy/build-allegro-win9x"
          ALLEGRO_PREFIX="$(pwd)/LANCommander.Launcher.Legacy/allegro4-win9x"

          cmake -S "$ALLEGRO_SRC" -B "$ALLEGRO_BUILD" \
              -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$ALLEGRO_PREFIX" \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DSHARED=OFF \
              -DWANT_EXAMPLES=OFF \
              -DWANT_TOOLS=OFF \
              -DWANT_TESTS=OFF \
              -DWANT_ALLEGROGL=OFF \
              -DWANT_LOADPNG=OFF \
              -DWANT_LOGG=OFF \
              -DWANT_JPGALLEG=OFF \
              -DWANT_FRAMEWORKS=OFF

          mingw32-make -C "$ALLEGRO_BUILD" -j$(nproc)
          mingw32-make -C "$ALLEGRO_BUILD" install

      # ---------------------------------------------------------------
      # Build the launcher
      # ---------------------------------------------------------------
      - name: Build launcher
        run: |
          LAUNCHER_DIR="LANCommander.Launcher.Legacy"
          LAUNCHER_BUILD="$LAUNCHER_DIR/build-win9x"
          ALLEGRO_PREFIX="$(pwd)/$LAUNCHER_DIR/allegro4-win9x"

          cmake -S "$LAUNCHER_DIR" -B "$LAUNCHER_BUILD" \
              -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DLAUNCHER_GFX_BACKEND=allegro \
              -DALLEGRO_STATIC=ON \
              -DTARGET_WIN9X=ON \
              -DALLEGRO_ROOT="$ALLEGRO_PREFIX"

          mingw32-make -C "$LAUNCHER_BUILD" -j$(nproc)

      # ---------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------
      - name: Package artifacts
        run: |
          mkdir -p out-win9x

          LAUNCHER_EXE=$(find LANCommander.Launcher.Legacy/build-win9x -name "launcher.exe" | head -1)
          cp "$LAUNCHER_EXE" out-win9x/LANCommander.exe
          strip out-win9x/LANCommander.exe

          # Assets load by path at runtime (they used to be RCDATA in the EXE).
          cp -r LANCommander.Launcher.Legacy/assets out-win9x/assets

          # No gdiplus.dll: image decoding is stb now, so there is no
          # redistributable to ship. MinGW CRT is statically linked.

          # Show PE info for verification
          objdump -p out-win9x/LANCommander.exe | grep -i "Version\|Subsystem" || true

          echo ""
          ls -lh out-win9x/

      - name: Win9x import check
        run: bash LANCommander.Launcher.Legacy/tools/deny-scan.sh out-win9x/LANCommander.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANCommander-Legacy-Win9x
          path: out-win9x/
          if-no-files-found: error

  build-sdl3:
    name: Build (SDL3 / MinGW-w64 i686)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 -- liblancommander/vendor/picoposh
          git -C liblancommander/vendor/picoposh submodule update --init --depth 1 \
              -- third_party/zlib third_party/libzip
          git submodule update --init --depth 1 -- \
              LANCommander.Launcher.Legacy/vendor/sdl3 \
              LANCommander.Launcher.Legacy/vendor/sdl_ttf
          git -C LANCommander.Launcher.Legacy/vendor/sdl_ttf \
              submodule update --init --depth 1 -- external/freetype

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            make

      - name: Download vendor dependencies
        shell: pwsh
        run: ./setup-vendor.ps1

      - name: Build launcher (SDL3)
        run: |
          cmake -S LANCommander.Launcher.Legacy -B LANCommander.Launcher.Legacy/build-sdl \
              -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=Release \
              -DLAUNCHER_GFX_BACKEND=sdl3
          mingw32-make -C LANCommander.Launcher.Legacy/build-sdl launcher -j$(nproc)
