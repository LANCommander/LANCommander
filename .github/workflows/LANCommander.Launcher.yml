name: LANCommander Launcher Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version_semver:
        description: "Semantic Version"
        required: true
        type: string
      version_tag:
        description: 'Version Tag'
        required: true
        type: string
      build_dotnet_version:
        description: 'Build .NET Version'
        required: true
        type: string
      build_runtime:
        description: 'Build Runtime'
        required: false
        type: string
        default: 'win-x64'
      build_arch:
        description: 'Build Architecture'
        required: false
        type: string
        default: 'x64'
      build_platform:
        description: 'Build Platform'
        required: false
        type: string
        default: 'Windows'
      build_configuration:
        description: 'Build Configuration (Debug/Release)'
        required: false
        type: string
        default: 'Release'
      retention_days:
        description: 'Artifact retention. These are a hand-off between jobs; the release assets are the durable copy.'
        required: false
        type: number
        default: 7

permissions:
  contents: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/package

jobs:
  # DLL injection only works between processes of the same bitness. The launcher is the packaging
  # worker for its own architecture (it hosts LANCommander.Packaging.Worker.Core), so a separate
  # worker ships only for each architecture it is not: x86 beside a win-x64 launcher, both beside
  # win-arm64, which emulates x64 and x86 but can inject into neither itself.
  #
  # The workers are Native AOT, a single executable each, and Native AOT cannot cross-compile from
  # Linux: it links with MSVC. So they get a Windows job of their own, and the launcher job below
  # (which runs on Linux) drops them into Data/Libraries/Packaging/.
  packaging-workers:
    if: inputs.build_platform == 'Windows'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.build_dotnet_version }}

    - name: Publish packaging workers
      shell: bash
      run: |
        set -euo pipefail

        RAW_VERSION="${{ inputs.version_tag }}"
        SEMVER="${RAW_VERSION#v}"

        case "${{ inputs.build_runtime }}" in
          win-x64)   ARCHITECTURES="x86" ;;
          win-x86)   ARCHITECTURES="x64" ;;
          win-arm64) ARCHITECTURES="x64 x86" ;;
          *) echo "No packaging workers are defined for ${{ inputs.build_runtime }}" >&2; exit 1 ;;
        esac

        for ARCH in $ARCHITECTURES; do
          dotnet publish "./LANCommander.Packaging.Worker/LANCommander.Packaging.Worker.csproj" \
            -c "${{ inputs.build_configuration }}" \
            --runtime "win-$ARCH" \
            -p:Version="$SEMVER" \
            -p:DebugType=none \
            -o "workers/$ARCH"

          # Fail the build rather than shipping a launcher whose packaging feature silently does
          # not work for this architecture.
          test -f "workers/$ARCH/LANCommander.Packaging.Worker.exe"
        done

    - name: Upload packaging workers
      uses: actions/upload-artifact@v4
      with:
        name: packaging-workers-${{ inputs.build_runtime }}
        path: workers/
        retention-days: 1

  build:
    needs: packaging-workers
    # Runs when the workers were built, or were not needed because this is not a Windows build.
    if: ${{ !cancelled() && (needs.packaging-workers.result == 'success' || needs.packaging-workers.result == 'skipped') }}
    runs-on: ${{ inputs.build_platform == 'Linux' && inputs.build_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    # Checkout code
    - uses: actions/checkout@v4
      with:
        submodules: true

    # .NET Setup
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.build_dotnet_version }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Publish Launcher
      run: |
        # Strip leading 'v' if present
        RAW_VERSION="${{ inputs.version_tag }}"       # e.g. v2.0.0-rc1
        SEMVER="${RAW_VERSION#v}"                     # 2.0.0-rc1

        # Numeric part only for Assembly/FileVersion
        NUMERIC="${SEMVER%%-*}"                       # 2.0.0
        ASSEMBLY_VERSION="${NUMERIC}.0"               # 2.0.0.0

        echo "SEMVER=$SEMVER"
        echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION"

        dotnet publish "./LANCommander.Launcher/LANCommander.Launcher.csproj" \
          -c "${{ inputs.build_configuration }}" \
          --self-contained \
          --runtime "${{ inputs.build_runtime }}" \
          -p:Version="$SEMVER" \
          -p:AssemblyVersion="$ASSEMBLY_VERSION" \
          -p:FileVersion="$ASSEMBLY_VERSION" \
          -p:InformationalVersion="$SEMVER" \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:IncludeAllContentForSelfExtract=true \
          -p:EnableCompressionInSingleFile=true \
          -p:DebugType=embedded

    # The workers from the packaging-workers job. They are loose files rather than launcher
    # content: as content, IncludeAllContentForSelfExtract would bundle them into the single file
    # and extract them to %TEMP%, which makes an executable that injects DLLs look like a dropper.
    - name: Add packaging workers (Windows)
      if: inputs.build_platform == 'Windows'
      uses: actions/download-artifact@v4
      with:
        name: packaging-workers-${{ inputs.build_runtime }}
        path: LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish/Data/Libraries/Packaging

    # The Interposer's binaries arrive with the launcher publish itself: the package's build targets
    # put them under Data/Libraries/Interposer/, as InterposerNativeOutputPath in the launcher's
    # project asks. Fail rather than ship a launcher that cannot start games under the Interposer
    # or capture installers.
    - name: Verify Data/Libraries (Windows)
      if: inputs.build_platform == 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        LIBRARIES="LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish/Data/Libraries"

        for ARCH in x64 x86; do
          test -f "$LIBRARIES/Interposer/$ARCH/LANCommander.Interposer.dll"
          test -f "$LIBRARIES/Interposer/$ARCH/LANCommander.Interposer.Injector.exe"
        done

        test -n "$(find "$LIBRARIES/Packaging" -name LANCommander.Packaging.Worker.exe)"

        find "$LIBRARIES" -type f

    - name: Bundle libvlc (Linux)
      if: inputs.build_platform == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        PUBLISH_DIR="LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish"
        VLC_DIR="$PUBLISH_DIR/libvlc/${{ inputs.build_runtime }}"
        mkdir -p "$VLC_DIR"

        retry_apt() {
          local description="$1"
          shift

          local max_attempts=3
          local delay_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "$description (attempt $attempt/$max_attempts)"

            if "$@"; then
              return 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::$description failed after $max_attempts attempts."
              return 1
            fi

            echo "::warning::$description failed. Refreshing apt metadata before retrying in ${delay_seconds}s."
            sleep "$delay_seconds"
            sudo apt-get update -qq || echo "::warning::Apt metadata refresh failed; retrying anyway."
          done
        }

        if [ "${{ inputs.build_arch }}" = "arm64" ]; then
          # Enable arm64 multiarch and add Ubuntu Ports repository so apt can
          # download arm64 packages on this x64 runner.
          sudo dpkg --add-architecture arm64
          CODENAME=$(lsb_release -cs)
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe" \
            | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list > /dev/null
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe" \
            | sudo tee -a /etc/apt/sources.list.d/ubuntu-ports-arm64.list > /dev/null
          retry_apt "Update apt package metadata" sudo apt-get update -qq

          retry_apt "Download arm64 VLC runtime packages" sudo apt-get download libvlc5:arm64 libvlccore9:arm64 vlc-plugin-base:arm64

          mkdir -p vlc-extracted
          for deb in libvlc5_*arm64.deb libvlccore9_*arm64.deb vlc-plugin-base_*arm64.deb; do
            dpkg -x "$deb" vlc-extracted/
          done

          LIB_DIR="vlc-extracted/usr/lib/aarch64-linux-gnu"
          PLUGINS_SRC="$LIB_DIR/vlc/plugins"
        else
          retry_apt "Update apt package metadata" sudo apt-get update -qq
          retry_apt "Install x64 VLC runtime packages" sudo apt-get install -y --no-install-recommends libvlc5 libvlccore9 vlc-plugin-base
          LIB_DIR="/usr/lib/x86_64-linux-gnu"
          PLUGINS_SRC="$LIB_DIR/vlc/plugins"
        fi

        # Copy the two core shared libraries, dereferencing symlinks so their
        # content is preserved correctly when zipped.
        for lib in libvlc.so.5 libvlccore.so.9; do
          src=$(find "$LIB_DIR" -maxdepth 1 -name "${lib}*" | sort | head -1)
          if [ -n "$src" ]; then
            cp -L "$src" "$VLC_DIR/$lib"
            echo "Bundled: $lib"
          else
            echo "WARNING: $lib not found in $LIB_DIR" >&2
          fi
        done

        # Copy VLC plugins (vlc-plugin-base covers common codecs and demuxers)
        if [ -d "$PLUGINS_SRC" ]; then
          mkdir -p "$VLC_DIR/plugins"
          cp -rL "$PLUGINS_SRC/." "$VLC_DIR/plugins/"
          echo "Bundled $(find "$VLC_DIR/plugins" -name "*.so" | wc -l) plugin(s)"
        fi

    - name: Bundle and Clean
      shell: pwsh
      run: |
        $BasePath = "LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish"

        # Remove unnecessary files
        $PathsToRemove = @(
          '*.pdb'
        )

        foreach ($path in $PathsToRemove) {
          Remove-Item -Recurse -Force -ErrorAction Continue "$BasePath/$path"
        }

    - name: Bundle macOS .app
      if: inputs.build_platform == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        # Strip leading 'v' and reduce to numeric x.y.z for the bundle version keys.
        RAW_VERSION="${{ inputs.version_tag }}"
        SEMVER="${RAW_VERSION#v}"
        NUMERIC="${SEMVER%%-*}"

        APP_NAME="LANCommander Launcher"
        EXECUTABLE="LANCommander.Launcher"
        BUNDLE_ID="app.lancommander.launcher"
        ICON_SRC="LANCommander.Launcher/Assets/icon.icns"

        PUBLISH_DIR="LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish"
        APP_DIR="${EXECUTABLE}.app"

        # Lay out the bundle skeleton.
        mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
        cp -a "$PUBLISH_DIR/." "$APP_DIR/Contents/MacOS/"
        cp "$ICON_SRC" "$APP_DIR/Contents/Resources/AppIcon.icns"

        # Write Info.plist.
        cat > "$APP_DIR/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key>
          <string>${APP_NAME}</string>
          <key>CFBundleDisplayName</key>
          <string>${APP_NAME}</string>
          <key>CFBundleIdentifier</key>
          <string>${BUNDLE_ID}</string>
          <key>CFBundleExecutable</key>
          <string>${EXECUTABLE}</string>
          <key>CFBundleIconFile</key>
          <string>AppIcon</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleInfoDictionaryVersion</key>
          <string>6.0</string>
          <key>CFBundleShortVersionString</key>
          <string>${NUMERIC}</string>
          <key>CFBundleVersion</key>
          <string>${SEMVER}</string>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
        </dict>
        </plist>
        PLIST

        # Ensure the entrypoint is executable, then zip while preserving the
        # permission bits (Compress-Archive drops the exec bit).
        chmod +x "$APP_DIR/Contents/MacOS/${EXECUTABLE}"
        zip -ry "LANCommander.Launcher-${{ inputs.build_platform }}-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.zip" "$APP_DIR"

    - name: Build AppImage (Linux)
      if: inputs.build_platform == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        PUBLISH_DIR="LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish"
        APP_NAME="LANCommander.Launcher"
        APPDIR="AppDir"

        # appimagetool / runtime architecture identifiers
        if [ "${{ inputs.build_arch }}" = "arm64" ]; then
          AI_ARCH="aarch64"
        else
          AI_ARCH="x86_64"
        fi
        export ARCH="$AI_ARCH"

        # --- Assemble the AppDir ---------------------------------------------
        rm -rf "$APPDIR"
        mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                 "$APPDIR/usr/share/icons/hicolor/scalable/apps"

        cp -r "$PUBLISH_DIR/." "$APPDIR/usr/bin/"
        chmod +x "$APPDIR/usr/bin/$APP_NAME"

        # Icon (use the prebuilt 256x256 project icon)
        ICON_SRC="LANCommander.Launcher/Assets/icon.png"
        ICON_DIR="$APPDIR/usr/share/icons/hicolor/256x256/apps"
        mkdir -p "$ICON_DIR"
        cp "$ICON_SRC" "$ICON_DIR/lancommander.png"

        cp "$ICON_DIR/lancommander.png" "$APPDIR/lancommander.png"
        ln -sf lancommander.png "$APPDIR/.DirIcon"

        # Desktop entry
        cat > "$APPDIR/usr/share/applications/lancommander.desktop" <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=LANCommander Launcher
        Comment=LANCommander Launcher
        Exec=LANCommander.Launcher
        Icon=lancommander
        Categories=Game;
        Terminal=false
        EOF
        cp "$APPDIR/usr/share/applications/lancommander.desktop" "$APPDIR/lancommander.desktop"

        # AppRun entry point
        cat > "$APPDIR/AppRun" <<'EOF'
        #!/bin/bash
        HERE="$(dirname "$(readlink -f "${0}")")"
        export PATH="${HERE}/usr/bin:${PATH}"
        export LD_LIBRARY_PATH="${HERE}/usr/bin:${LD_LIBRARY_PATH:-}"
        exec "${HERE}/usr/bin/LANCommander.Launcher" "$@"
        EOF
        chmod +x "$APPDIR/AppRun"

        # --- Fetch appimagetool ----------------------------------------------
        TOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${AI_ARCH}.AppImage"
        curl -L -o appimagetool "$TOOL_URL"
        chmod +x appimagetool

        # --- Build the AppImage ----------------------------------------------
        OUT="LANCommander.Launcher-Linux-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.AppImage"
        ./appimagetool --appimage-extract-and-run "$APPDIR" "$OUT"

        echo "Produced $OUT"

    - name: Upload AppImage Artifact (Linux)
      if: inputs.build_platform == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        path: LANCommander.Launcher-Linux-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.AppImage
        name: LANCommander.Launcher-Linux-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.AppImage
        retention-days: ${{ inputs.retention_days }}

    - name: Compress Build Output
      if: inputs.build_platform != 'macOS'
      shell: pwsh
      run: |
        $compress = @{
          Path = "LANCommander.Launcher/bin/${{ inputs.build_configuration }}/net10.0/${{ inputs.build_runtime }}/publish/*"
          DestinationPath = "LANCommander.Launcher-${{ inputs.build_platform }}-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.zip"
          CompressionLevel = "Fastest"
        }
        Compress-Archive @compress

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        path: LANCommander.Launcher-${{ inputs.build_platform }}-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.zip
        name: LANCommander.Launcher-${{ inputs.build_platform }}-${{ inputs.build_arch }}-v${{ inputs.version_tag }}.zip
        retention-days: ${{ inputs.retention_days }}
