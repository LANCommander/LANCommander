name: LANCommander Nightly (Launcher)

# Launcher half of the nightly. Runs only when launcher code has changed since the
# last launcher nightly or the last release, whichever is further along - see
# LANCommander.Nightly.Prep.yml for the gate.
#
# Assets land on the shared `nightly` release. This workflow only ever touches
# LANCommander.Launcher-* assets, so it cannot clobber the server nightly.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if nothing changed'
        type: boolean
        default: false
  schedule:
    # Half an hour after the server nightly, so the two rarely contend for the
    # shared release.
    - cron: '30 9 * * *'

permissions:
  contents: write

jobs:
  prep:
    uses: ./.github/workflows/LANCommander.Nightly.Prep.yml
    with:
      component: launcher
      force: ${{ inputs.force == true }}
      # Dependency closure of LANCommander.Launcher, plus the files that change how
      # it is built.
      paths: |
        LANCommander.Launcher/
        LANCommander.Launcher.Data/
        LANCommander.Launcher.Models/
        LANCommander.Launcher.Services/
        LANCommander.Launcher.Settings/
        LANCommander.SDK/
        LANCommander.SDK.SourceGenerators/
        LANCommander.Steam/
        Directory.Packages.props
        Microsoft.Common.props
        LANCommander.slnx
        .github/workflows/LANCommander.Launcher.yml
        .github/workflows/LANCommander.Nightly.Launcher.yml
        .github/workflows/LANCommander.Nightly.Prep.yml

  build_launcher_linux_arm64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: linux-arm64
      build_arch: arm64
      build_platform: Linux
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  build_launcher_linux_x64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: linux-x64
      build_arch: x64
      build_platform: Linux
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  build_launcher_osx_arm64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: osx-arm64
      build_arch: arm64
      build_platform: macOS
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  build_launcher_osx_x64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: osx-x64
      build_arch: x64
      build_platform: macOS
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  build_launcher_win_arm64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: win-arm64
      build_arch: arm64
      build_platform: Windows
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  build_launcher_win_x64:
    needs: [prep]
    if: needs.prep.outputs.should_build == 'true'
    uses: ./.github/workflows/LANCommander.Launcher.yml
    with:
      build_dotnet_version: ${{ needs.prep.outputs.build_dotnet_version }}
      version_semver: ${{ needs.prep.outputs.version_semver }}
      version_tag: ${{ needs.prep.outputs.version_tag }}
      build_runtime: win-x64
      build_arch: x64
      build_platform: Windows
      build_configuration: Debug
      # The nightly release assets are the durable copy of these.
      retention_days: 2

  publish_nightly_release:
    runs-on: ubuntu-latest
    needs:
      - prep
      - build_launcher_linux_arm64
      - build_launcher_linux_x64
      - build_launcher_osx_arm64
      - build_launcher_osx_x64
      - build_launcher_win_arm64
      - build_launcher_win_x64
    if: needs.prep.outputs.should_build == 'true'
    # Serialised against the server nightly, which mutates the same release.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create Temp Directory
        run: mkdir -p artifacts

      # Picks up both the per-platform zips and the two Linux AppImages.
      - name: Download Launcher Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LANCommander.Launcher-*-v${{ needs.prep.outputs.version_tag }}.*
          path: artifacts
          merge-multiple: true

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NOTES="This is the latest nightly build. These builds are generated automatically and should be considered unstable.

          Server and Launcher nightlies are built independently, so their versions may differ."

          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly Build" --notes "$NOTES"
          else
            gh release create nightly --prerelease --title "Nightly Build" --notes "$NOTES"
          fi

          # Drop only this component's assets, so the server nightly's files survive.
          # Names carry the version, so yesterday's assets would otherwise linger.
          gh release view nightly --json assets -q '.assets[].name' \
            | { grep -E '^LANCommander\.Launcher-' || true; } \
            | while read -r asset; do
                echo "Removing stale asset: $asset"
                gh release delete-asset nightly "$asset" -y
              done

          gh release upload nightly artifacts/* --clobber

  update_marker:
    runs-on: ubuntu-latest
    needs: [prep, publish_nightly_release]
    if: needs.prep.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4

      # Moving the marker is what makes tomorrow's gate compare against tonight's
      # build. It runs last so a failed build is retried rather than skipped.
      - name: Advance nightly-launcher marker
        run: |
          set -euo pipefail
          git tag -f nightly-launcher "$GITHUB_SHA"
          git push -f origin refs/tags/nightly-launcher
          echo "nightly-launcher now points at $GITHUB_SHA"
