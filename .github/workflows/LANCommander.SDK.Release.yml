name: LANCommander SDK Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      version_semver: ${{ steps.version.outputs.version_semver }}
    steps:
      - name: Parse Version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Other releases (e.g. nightly) are skipped, not failed
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-.+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix. Skipping publish."
            echo "publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # version_tag keeps the prerelease suffix for the package version; version_semver drops it
          # because AssemblyVersion only accepts numeric parts
          echo "publish=true" >> $GITHUB_OUTPUT
          echo "version_tag=${TAG#v}" >> $GITHUB_OUTPUT
          echo "version_semver=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT

  publish:
    needs: prep
    if: needs.prep.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LANCommander.SDK/LANCommander.SDK.csproj

      - name: Build project
        run: dotnet build --configuration Release LANCommander.SDK/LANCommander.SDK.csproj -p:Version="${{ needs.prep.outputs.version_tag }}" -p:AssemblyVersion="${{ needs.prep.outputs.version_semver }}"

      - name: Pack NuGet package with symbols
        run: dotnet pack LANCommander.SDK/LANCommander.SDK.csproj --no-build --configuration Release -p:PackageVersion=${{ needs.prep.outputs.version_tag }} -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -o ./artifacts

      # --skip-duplicate so re-running a release (or re-publishing a prerelease) doesn't fail on 409
      - name: Publish NuGet package
        run: |
          dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
