name: Publish to WinGet
on:
  release:
    types: [published]

permissions:
  contents: write  # gh release download / upload
  id-token: write  # OIDC token for Azure Artifact Signing

jobs:
  create-installers:
    runs-on: windows-latest
    strategy:
      matrix:
        app: ['Server', 'Launcher']
        arch: ['x64', 'arm64']
    env:
      # See LANCommander.Sign.yml for the required secrets and variables. Leaving
      # AZURE_SIGNING_ENDPOINT unset skips signing and ships an unsigned installer.
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ENDPOINT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download release artifact
        shell: pwsh
        run: |
          $releaseAsset = "LANCommander.${{ matrix.app }}-Windows-${{ matrix.arch }}-v${{ env.VERSION }}.zip"
          gh release download ${{ github.ref_name }} -p $releaseAsset
          Expand-Archive $releaseAsset -DestinationPath ".\extracted"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Install Inno Setup
      - name: Install Inno Setup
        run: |
          curl -L -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          .\innosetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
        shell: cmd

      # Create Inno Setup script
      - name: Create installer script
        run: |
          $appId = if ('${{ matrix.app }}' -eq 'Server') {
            '2C58E237-1D69-42A0-B702-F995B75B8A5E'
          } else {
            'A3D4F8E1-7B2C-4E5D-9F1A-6C8B3D7E2F4A'
          }

          @"
          #define MyAppName "LANCommander ${{ matrix.app }}"
          #define MyAppVersion "${{ env.VERSION }}"
          #define MyAppPublisher "LANCommander"
          #define MyAppURL "https://github.com/${{ github.repository }}"
          #define MyAppExeName "LANCommander.${{ matrix.app }}.exe"
          #define Architecture "${{ matrix.arch }}"

          [Setup]
          AppId={{$appId}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\LANCommander\{#MyAppName}
          DisableProgramGroupPage=yes
          OutputBaseFilename=LANCommander.${{ matrix.app }}-{#MyAppVersion}-{#Architecture}-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=${{ matrix.arch == 'x64' && 'x64' || 'arm64' }}
          ArchitecturesInstallIn64BitMode=${{ matrix.arch == 'x64' && 'x64' || 'arm64' }}

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "extracted\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          "@ | Out-File -FilePath "installer.iss" -Encoding UTF8
        shell: pwsh

      # Build installer
      - name: Build installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
        shell: pwsh

      # Sign the installer. The payload inside it is already signed, since this job
      # repackages the release assets produced by LANCommander.Sign.yml.
      - name: Setup .NET
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\Output\LANCommander.${{ matrix.app }}-${{ env.VERSION }}-${{ matrix.arch }}-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Pin authentication to the session established by azure/login rather than
          # letting DefaultAzureCredential fall through a chain of unconfigured options.
          exclude-environment-credential: true
          exclude-azure-cli-credential: false

      - name: Verify installer signature
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = "Output/LANCommander.${{ matrix.app }}-${{ env.VERSION }}-${{ matrix.arch }}-Setup.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer

          if ($signature.Status -ne 'Valid') {
            throw "$installer : $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "$installer : signed but not timestamped"
          }

          Write-Host "$installer : Valid ($($signature.SignerCertificate.Subject))"

      # Upload installer to release
      - name: Upload installer to release
        run: |
          gh release upload ${{ github.ref_name }} "Output/LANCommander.${{ matrix.app }}-${{ env.VERSION }}-${{ matrix.arch }}-Setup.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    needs: create-installers
    runs-on: windows-latest
    strategy:
      matrix:
        app: ['Server', 'Launcher']
    steps:
      - name: Get version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Submit package to Windows Package Manager Community Repository
        run: |
          $x64Url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LANCommander.${{ matrix.app }}-${env:VERSION}-x64-Setup.exe"
          $arm64Url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LANCommander.${{ matrix.app }}-${env:VERSION}-arm64-Setup.exe"
          .\wingetcreate.exe update --submit --token "${{ secrets.WINGET_TOKEN }}" --urls $x64Url $arm64Url --version ${env:VERSION} LANCommander.${{ matrix.app }}
        shell: pwsh
