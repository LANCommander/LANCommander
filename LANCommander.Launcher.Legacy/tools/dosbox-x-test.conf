# DOSBox-X configuration for smoke-testing the DOS launcher.
#
#   cp tools/dosbox-x-test.conf out-dos/dosbox-x.conf
#   cd out-dos && dosbox-x -conf dosbox-x.conf
#
# Every setting below is load-bearing; the defaults get you a launcher that
# starts and then draws nothing.

[sdl]
autolock=false
output=surface

[dos]
# The bundled assets are not 8.3 names -- "Inter-Regular.ttf", the icon PNGs,
# and the "backgrounds" directory itself. Without this the launcher comes up
# with no text and no artwork, which is exactly what a real DOS machine
# without DOSLFN loaded will do.
lfn=true

# LFN needs a DOS version that admits to supporting it.
ver=7.1

[dosbox]
# S3 Trio gives VBE 2.0 with a linear frame buffer, which is what gfx_dos.cpp
# requires. machine=vga or svga_et3000 will fail at startup.
machine=svga_s3

# The launcher's own backbuffer is 1.9 MB at 800x600, and the image cache sits
# on top of it. 63 MB is generous; below ~16 MB expect allocation failures.
memsize=63

# Stops DOSBox-X asking for a working directory on startup, which it otherwise
# does with a modal dialog.
working directory option=noprompt

[cpu]
cputype=pentium
core=dynamic
cycles=100000

[autoexec]
# Adjust to wherever out-dos/ actually is.
mount c .
c:
LANCMDR.EXE
